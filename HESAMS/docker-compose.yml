services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:?set SA_PASSWORD in .env}"
    ports: ["1433:1433"]
    volumes: ["mssql-data:/var/opt/mssql"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    depends_on:
      db: { condition: service_healthy }
    environment:
      ConnectionStrings__Default: "Server=db;Database=HESAMS;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: "${JWT_KEY:?set JWT_KEY in .env}"
      ASPNETCORE_ENVIRONMENT: "Production"
    ports: ["8080:8080"]

volumes:
  mssql-data:
